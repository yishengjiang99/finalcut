<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" font-family="sans-serif" font-size="13"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="20" y="20" width="400" height="62" rx="8" fill="#eef4ff" stroke="#333"/><text x="220.0" y="40.0" text-anchor="middle">Zone generators from the SoundFont</text><text x="220.0" y="56.0" text-anchor="middle">(reverb send gen 16, chorus send gen 15,</text><text x="220.0" y="72.0" text-anchor="middle">envelopes, filter, LFO)</text><rect x="20" y="110" width="400" height="62" rx="8" fill="#eef4ff" stroke="#333"/><text x="220.0" y="138.0" text-anchor="middle">CC modulators (default: CC91 adds up to</text><text x="220.0" y="154.0" text-anchor="middle">20% reverb send, CC93 up to 20% chorus send)</text><line x1="420" y1="51" x2="500" y2="90" stroke="#333" marker-end="url(#a)"/><line x1="420" y1="141" x2="500" y2="110" stroke="#333" marker-end="url(#a)"/><rect x="505" y="65" width="235" height="70" rx="8" fill="#eef4ff" stroke="#333"/><text x="622.5" y="89.0" text-anchor="middle">sum, clamped to the</text><text x="622.5" y="105.0" text-anchor="middle">generator range = value</text><text x="622.5" y="121.0" text-anchor="middle">for each voice</text></svg>