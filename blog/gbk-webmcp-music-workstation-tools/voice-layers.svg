<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" font-family="sans-serif" font-size="13"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="20" y="20" width="400" height="62" rx="8" fill="#eef4ff" stroke="#333"/><text x="220.0" y="40.0" text-anchor="middle">1. Zone generators from the SoundFont</text><text x="220.0" y="56.0" text-anchor="middle">(reverb send gen 16, chorus send gen 15,</text><text x="220.0" y="72.0" text-anchor="middle">envelopes, filter, LFO)</text><rect x="20" y="108" width="400" height="62" rx="8" fill="#eef4ff" stroke="#333"/><text x="220.0" y="136.0" text-anchor="middle">2. Modulators (default: CC91 adds up to</text><text x="220.0" y="152.0" text-anchor="middle">20% reverb send, CC93 up to 20% chorus send)</text><rect x="20" y="196" width="400" height="62" rx="8" fill="#eef4ff" stroke="#333"/><text x="220.0" y="224.0" text-anchor="middle">3. Agent or Sound panel override per track</text><text x="220.0" y="240.0" text-anchor="middle">(set, add or scale, optional key range)</text><line x1="420" y1="51" x2="500" y2="120" stroke="#333" marker-end="url(#a)"/><line x1="420" y1="139" x2="500" y2="140" stroke="#333" marker-end="url(#a)"/><line x1="420" y1="227" x2="500" y2="160" stroke="#333" marker-end="url(#a)"/><rect x="505" y="105" width="235" height="70" rx="8" fill="#eef4ff" stroke="#333"/><text x="622.5" y="129.0" text-anchor="middle">sum, clamped to the</text><text x="622.5" y="145.0" text-anchor="middle">SF2 range = value</text><text x="622.5" y="161.0" text-anchor="middle">for each voice</text></svg>