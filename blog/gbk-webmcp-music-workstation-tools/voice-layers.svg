<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" font-family="sans-serif" font-size="13" viewBox="0 0 760 280"><defs><marker id="a" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#333" d="M0,0 L8,4 L0,8 z"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect width="400" height="62" x="20" y="20" fill="#eef4ff" stroke="#333" rx="8"/><text x="220" y="40" text-anchor="middle">1. Zone generators from the SoundFont</text><text x="220" y="56" text-anchor="middle">(reverb send gen 16, chorus send gen 15,</text><text x="220" y="72" text-anchor="middle">envelopes, filter, LFO)</text><rect width="400" height="62" x="20" y="108" fill="#eef4ff" stroke="#333" rx="8"/><text x="220" y="136" text-anchor="middle">2. Modulators (default: CC91 adds up to</text><text x="220" y="152" text-anchor="middle">20% reverb send, CC93 up to 20% chorus send)</text><rect width="400" height="62" x="20" y="196" fill="#eef4ff" stroke="#333" rx="8"/><text x="220" y="224" text-anchor="middle">3. Agent or Sound panel override per track</text><text x="220" y="240" text-anchor="middle">(set, add or scale, optional key range)</text><line x1="420" x2="500" y1="51" y2="120" stroke="#333" marker-end="url(#a)"/><line x1="420" x2="500" y1="139" y2="140" stroke="#333" marker-end="url(#a)"/><line x1="420" x2="500" y1="227" y2="160" stroke="#333" marker-end="url(#a)"/><rect width="235" height="70" x="505" y="105" fill="#eef4ff" stroke="#333" rx="8"/><text x="622.5" y="129" text-anchor="middle">sum, clamped to the</text><text x="622.5" y="145" text-anchor="middle">SF2 range = value</text><text x="622.5" y="161" text-anchor="middle">for each voice</text></svg>