name: iOS bundle BigBuckBunny

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point Xcode target at public/BigBuckBunny.mp4 and load it
        run: |
          set -euo pipefail
          test -f public/BigBuckBunny.mp4
          PBX=ios/FinalCut.xcodeproj/project.pbxproj
          EV=ios/FinalCut/Features/Editor/EditorView.swift
          python3 - <<'PY'
          from pathlib import Path
          pbx = Path("ios/FinalCut.xcodeproj/project.pbxproj")
          s = pbx.read_text()
          s = s.replace(
              '7D42470D6EA843639F8EC21E /* finalcap-test-video.mp4 in Resources */ = {isa = PBXBuildFile; fileRef = 59C829D9D1054B0D87489025 /* finalcap-test-video.mp4 */; };',
              '7D42470D6EA843639F8EC21E /* BigBuckBunny.mp4 in Resources */ = {isa = PBXBuildFile; fileRef = 59C829D9D1054B0D87489025 /* BigBuckBunny.mp4 */; };',
          )
          s = s.replace(
              '59C829D9D1054B0D87489025 /* finalcap-test-video.mp4 */ = {isa = PBXFileReference; lastKnownFileType = file; path = "finalcap-test-video.mp4"; sourceTree = "<group>"; };',
              '59C829D9D1054B0D87489025 /* BigBuckBunny.mp4 */ = {isa = PBXFileReference; lastKnownFileType = file; name = "BigBuckBunny.mp4"; path = "../public/BigBuckBunny.mp4"; sourceTree = SOURCE_ROOT; };',
          )
          s = s.replace('59C829D9D1054B0D87489025 /* finalcap-test-video.mp4 */,', '59C829D9D1054B0D87489025 /* BigBuckBunny.mp4 */,')
          s = s.replace('7D42470D6EA843639F8EC21E /* finalcap-test-video.mp4 in Resources */,', '7D42470D6EA843639F8EC21E /* BigBuckBunny.mp4 in Resources */,')
          if 'path = "../public/BigBuckBunny.mp4"' not in s:
              raise SystemExit('pbx patch did not apply; fileRef layout changed')
          pbx.write_text(s)
          ev = Path("ios/FinalCut/Features/Editor/EditorView.swift")
          t = ev.read_text()
          old = 'Bundle.main.url(forResource: "finalcap-test-video", withExtension: "mp4")'
          new = 'Bundle.main.url(forResource: "BigBuckBunny", withExtension: "mp4")\n            ?? Bundle.main.url(forResource: "finalcap-test-video", withExtension: "mp4")'
          if old not in t:
              if 'forResource: "BigBuckBunny"' in t:
                  print('EditorView already loads BigBuckBunny')
              else:
                  raise SystemExit('EditorView sample URL not found')
          else:
              ev.write_text(t.replace(old, new, 1))
          PY
          echo "--- pbx refs ---"
          grep -n 'BigBuckBunny\|finalcap-test-video' "$PBX"
          echo "--- editor ---"
          grep -n 'BigBuckBunny\|finalcap-test-video' "$EV"
      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/FinalCut.xcodeproj/project.pbxproj ios/FinalCut/Features/Editor/EditorView.swift
          if git diff --cached --quiet; then
            echo 'no changes'
            exit 0
          fi
          git commit -m "ios: Copy Bundle Resources includes public/BigBuckBunny.mp4"
          git push origin HEAD
