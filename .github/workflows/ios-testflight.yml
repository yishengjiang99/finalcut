name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      notes:
        description: What Testers notes (optional)
        required: false
        default: CI build
      marketing_version:
        description: CFBundleShortVersionString — 'auto' (default) resolves the open train from ASC, or bumps the minor past the live version; or pin a version e.g. 1.1
        required: true
        default: 'auto'

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-upload:
    name: Archive and upload
    runs-on: macos-15
    timeout-minutes: 75
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_PATH: ${{ github.workspace }}/private_keys/AuthKey.p8
      ARCHIVE_PATH: ${{ github.workspace }}/build/FinalCut.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      TEAM_ID: 83D36RPMUM
      BUNDLE_ID: com.ragnus.w2
      PROFILE_NAME: FinalCap App Store

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle the sample clip
        run: |
          set -euo pipefail
          test -f public/sample-lake.mp4
          mkdir -p ios/FinalCut/SampleMedia
          cp public/sample-lake.mp4 ios/FinalCut/SampleMedia/finalcap-test-video.mp4
          cp public/sample-lake.mp4 ios/FinalCut/SampleMedia/sample-lake.mp4
          ls -la ios/FinalCut/SampleMedia public/sample-lake.mp4
          ffprobe -v error -show_entries stream=width,height,codec_type -of default=nw=1 ios/FinalCut/SampleMedia/finalcap-test-video.mp4 || true

      - name: Select Xcode
        run: |
          set -euo pipefail
          for app in /Applications/Xcode_26.0.app /Applications/Xcode_26.app /Applications/Xcode-26.app /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app /Applications/Xcode_16.2.app /Applications/Xcode_16.app /Applications/Xcode.app; do
            if [[ -d "$app" ]]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version
          ls /Applications | grep -i Xcode || true

      - name: Write ASC API key
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "${APP_STORE_CONNECT_KEY_ID:-}"
          test -n "${APP_STORE_CONNECT_ISSUER_ID:-}"
          test -n "${P8:-}"
          mkdir -p "$(dirname "$ASC_KEY_PATH")"
          printf '%s\n' "$P8" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$ASC_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Install Distribution cert + App Store profile
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${P12_BASE64:-}" && test -n "${P12_PASSWORD:-}" && test -n "${PROFILE_BASE64:-}"
          CERT_PATH=$RUNNER_TEMP/dist.p12
          PROFILE_PATH=$RUNNER_TEMP/appstore.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo -n "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Installed profile UUID=$UUID"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Verify Xcode project
        working-directory: ios
        run: |
          set -euo pipefail
          test -f FinalCut.xcodeproj/project.pbxproj
          xcodebuild -list -project FinalCut.xcodeproj

      - name: Write ExportOptions.plist
        run: |
          cat > "$GITHUB_WORKSPACE/ExportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          sed -i '' 's/^          //' "$GITHUB_WORKSPACE/ExportOptions.plist"
          plutil -lint "$GITHUB_WORKSPACE/ExportOptions.plist"

      - name: Resolve marketing version
        env:
          MV_INPUT: ${{ github.event.inputs.marketing_version }}
        run: |
          set -euo pipefail
          if [[ -n "${MV_INPUT:-}" && "$MV_INPUT" != "auto" ]]; then
            echo "MV=$MV_INPUT" >> "$GITHUB_ENV"
            echo "Marketing version pinned by input: $MV_INPUT"
            exit 0
          fi
          # Auto: ask App Store Connect. If an open (not live) App Store train
          # exists — editable or in review — upload into the highest one. If
          # every App Store version is live, bump the minor of the highest
          # live version (1.0.1 -> 1.1). TestFlight-only trains are ignored on
          # purpose: the next train always derives from the App Store version
          # list, never from a stray TestFlight upload. No hardcoded default
          # to go stale again; an ASC failure fails the run loudly.
          # Same interpreter for install and run: on macos runners bare `pip`
          # and `python3` are different Pythons (the repo's other ASC workflows
          # get away with it on ubuntu, where they coincide) — run 40478182279
          # died on ModuleNotFoundError: jwt for exactly that reason.
          python3 -m pip install -q PyJWT cryptography
          python3 -c "import jwt, sys; print('PyJWT ready:', sys.executable)"
          python3 <<'PY'
          import json, os, time, urllib.request
          import jwt
          key_id = os.environ["APP_STORE_CONNECT_KEY_ID"].strip()
          issuer = os.environ["APP_STORE_CONNECT_ISSUER_ID"].strip()
          p8 = open(os.environ["ASC_KEY_PATH"]).read().strip()
          now = int(time.time())
          token = jwt.encode({"iss": issuer, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"}, p8, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})
          def api(path):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=90) as r:
                  return json.loads(r.read().decode() or "{}")
          apps = api(f"/v1/apps?filter[bundleId]={os.environ['BUNDLE_ID']}")
          app_id = apps["data"][0]["id"]
          states = {}
          live = set()
          vers = api(f"/v1/apps/{app_id}/appStoreVersions?filter[platform]=IOS&limit=50")
          for v in vers.get("data", []):
              s = v["attributes"]["versionString"]
              states[s] = v["attributes"].get("appStoreState")
              if states[s] == "READY_FOR_SALE":
                  live.add(s)
          def keyf(s):
              parts = [int(x) for x in s.split(".")]
              return parts + [0] * (3 - len(parts))
          versions = sorted(states, key=keyf)
          if not versions:
              raise SystemExit("No versions found in App Store Connect")
          open_trains = [v for v in versions if v not in live]
          if open_trains:
              nxt, why = open_trains[-1], "open train"
          else:
              top = keyf(versions[-1])
              nxt, why = f"{top[0]}.{top[1] + 1}", f"newest {versions[-1]} is live, minor bump"
          print(f"Auto marketing version: {nxt} ({why}); ASC states: {states}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"MV={nxt}\n")
          PY

      - name: Archive
        working-directory: ios
        run: |
          set -euo pipefail
          test -n "${MV:-}" || { echo "::error::MV is unset — the Resolve marketing version step did not run"; exit 1; }
          # Never upload into the 1.0 train while 1.0 is in App Store review.
          [[ "$MV" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ && "$MV" != "1.0" && "$MV" != "1.0.0" ]] || { echo "::error::marketing_version must be a valid version other than 1.0 (got '$MV')"; exit 1; }
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          set -o pipefail
          xcodebuild \
            -project FinalCut.xcodeproj \
            -scheme FinalCut \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="$MV" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive
          test -d "$ARCHIVE_PATH"

      - name: Export IPA
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_PATH"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          ls -la "$EXPORT_PATH"
          test -n "$(find "$EXPORT_PATH" -name '*.ipa' | head -1)"

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          IPA=$(find "$EXPORT_PATH" -name '*.ipa' | head -1)
          echo "Uploading $IPA (build ${{ github.run_number }})"
          set -o pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool-upload.log"
          if grep -Eiq 'UPLOAD FAILED|Validation failed|STATE_ERROR\.VALIDATION_ERROR|Failed to upload package|ERROR:\s*\[altool' "$RUNNER_TEMP/altool-upload.log"; then
            echo "::error::altool upload/validation failed (see log)"
            exit 1
          fi
          if ! grep -Eiq 'UPLOAD SUCCEEDED|No errors uploading|Delivery UUID|The package was successfully uploaded' "$RUNNER_TEMP/altool-upload.log"; then
            echo "::error::altool did not report success"
            exit 1
          fi

      - name: Summary
        if: success()
        run: |
          {
            echo "### TestFlight upload"
            echo "- Bundle: \`$BUNDLE_ID\`"
            echo "- Build: \`${{ github.run_number }}\`"
            echo "- Sample: sample-lake.mp4 copied over finalcap-test-video.mp4"
            echo "- Notes: ${{ github.event.inputs.notes }}"
            echo "- Version: $MV (${{ github.run_number }})"
            echo "- Wait a few minutes in App Store Connect for processing, then install the new build."
          } >> "$GITHUB_STEP_SUMMARY"
