name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full test suite instead of the smoke subset'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Real MariaDB for src/test/quota-enforcement.test.js (quota atomicity with mysql2 defaults).
    # Throwaway CI-only database and user; not a real credential.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: quota_test
          MARIADB_USER: quota_test
          MARIADB_PASSWORD: quota_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (smoke subset on merge — full suite via `npm test` locally or workflow_dispatch)
        run: ${{ inputs.full && 'npm test' || 'npm run test:smoke' }}
        env:
          QUOTA_DB_TEST_HOST: 127.0.0.1
          QUOTA_DB_TEST_USER: quota_test
          QUOTA_DB_TEST_PASSWORD: quota_test
          QUOTA_DB_TEST_DATABASE: quota_test
