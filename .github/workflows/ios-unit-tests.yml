# iOS unit tests — gate for ios/** PRs (FinalCutTests).
name: iOS Unit Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unit-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unit-tests.yml'

concurrency:
  group: ios-unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: FinalCutTests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          for app in /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app /Applications/Xcode_16.2.app /Applications/Xcode_16.app /Applications/Xcode_26.0.app /Applications/Xcode.app; do
            if [[ -d "$app" ]]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version

      - name: Resolve simulator destination
        id: sim
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(raw)
          prefer = ["iPhone 16", "iPhone 16 Pro", "iPhone 15", "iPhone 15 Pro", "iPhone SE (3rd generation)"]
          by_name = {}
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime and "iPhone" not in runtime:
                  # still collect
                  pass
              for d in devices:
                  if not d.get("isAvailable"):
                      continue
                  name = d.get("name") or ""
                  if "iPhone" not in name:
                      continue
                  by_name.setdefault(name, d["udid"])
          udid = None
          chosen = None
          for name in prefer:
              if name in by_name:
                  udid, chosen = by_name[name], name
                  break
          if udid is None and by_name:
              chosen, udid = next(iter(by_name.items()))
          if not udid:
              sys.exit("No available iPhone simulator")
          print(f"Using simulator {chosen} ({udid})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"destination=platform=iOS Simulator,id={udid}\n")
          PY

      - name: Use the software keyboard in the simulator
        # UI tests check that the on-screen keyboard hides; a connected hardware keyboard hides it anyway.
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false

      - name: Run FinalCutTests + FinalCutUITests
        working-directory: ios
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -project FinalCut.xcodeproj \
            -scheme FinalCut \
            -destination "${{ steps.sim.outputs.destination }}" \
            -only-testing:FinalCutTests \
            -only-testing:FinalCutUITests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Print test failure details
        if: failure()
        working-directory: ios
        run: xcrun xcresulttool get test-results summary --path TestResults.xcresult --format json

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult
          if-no-files-found: ignore

  build-xcode26:
    # TestFlight archives with Xcode 26 (iOS 26 SDK: SpeechAnalyzer paths compile only there).
    name: Release build (Xcode 26)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        id: xcode
        run: |
          set -euo pipefail
          for app in /Applications/Xcode_26.0.app /Applications/Xcode_26.app /Applications/Xcode-26.app; do
            if [[ -d "$app" ]]; then
              sudo xcode-select -s "$app"
              echo "found=true" >> "$GITHUB_OUTPUT"
              xcodebuild -version
              exit 0
            fi
          done
          echo "::notice::Xcode 26 not installed on this runner; skipping."
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Build (Release, generic iOS, unsigned)
        if: steps.xcode.outputs.found == 'true'
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project FinalCut.xcodeproj \
            -scheme FinalCut \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
