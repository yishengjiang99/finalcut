# iOS unit tests — gate for ios/** PRs (FinalCutTests).
name: iOS Unit Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unit-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unit-tests.yml'

concurrency:
  group: ios-unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: FinalCutTests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          for app in /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app /Applications/Xcode_16.2.app /Applications/Xcode_16.app /Applications/Xcode_26.0.app /Applications/Xcode.app; do
            if [[ -d "$app" ]]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version

      - name: Resolve simulator destination
        id: sim
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(raw)
          prefer = ["iPhone 16", "iPhone 16 Pro", "iPhone 15", "iPhone 15 Pro", "iPhone SE (3rd generation)"]
          by_name = {}
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime and "iPhone" not in runtime:
                  # still collect
                  pass
              for d in devices:
                  if not d.get("isAvailable"):
                      continue
                  name = d.get("name") or ""
                  if "iPhone" not in name:
                      continue
                  by_name.setdefault(name, d["udid"])
          udid = None
          chosen = None
          for name in prefer:
              if name in by_name:
                  udid, chosen = by_name[name], name
                  break
          if udid is None and by_name:
              chosen, udid = next(iter(by_name.items()))
          if not udid:
              sys.exit("No available iPhone simulator")
          print(f"Using simulator {chosen} ({udid})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"destination=platform=iOS Simulator,id={udid}\n")
          PY

      - name: Run FinalCutTests
        working-directory: ios
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -project FinalCut.xcodeproj \
            -scheme FinalCut \
            -destination "${{ steps.sim.outputs.destination }}" \
            -only-testing:FinalCutTests \
            CODE_SIGNING_ALLOWED=NO \
            test
