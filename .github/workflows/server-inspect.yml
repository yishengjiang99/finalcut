# Read-only inspection of the production app layout (manual). Prints how the finalcut service
# runs and which files in DEPLOY_DIR are runtime state (not from git / build), so the release-
# directory migration can preserve them. Never prints secret values: Environment= values and
# .env values are redacted (key names only).
name: Server inspect (read-only)
on:
  workflow_dispatch:
    inputs:
      section:
        description: 'app = service/app layout (default); nginx = nginx/firewall/port-80/mysql read-only report; vhosts = photo/music vhost files + static roots'
        type: choice
        options: [app, nginx, vhosts]
        default: app
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_DIR: ${{ vars.DEPLOY_DIR }}
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          if [[ -n "${DEPLOY_SSH_KNOWN_HOSTS:-}" ]]; then printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true; fi
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect (read-only)
        if: ${{ github.event.inputs.section == 'app' || github.event.inputs.section == '' }}
        run: |
          set -uo pipefail
          git ls-tree --name-only HEAD > /tmp/tracked.txt
          cat > /tmp/remote.sh <<'REMOTE'
          set -u
          echo "== systemd unit (Environment values redacted)"
          systemctl cat finalcut 2>&1 | sed -E 's/^(Environment=)"?([A-Za-z_][A-Za-z0-9_]*)=.*/\1\2=<redacted>/'
          systemctl show finalcut -p User -p Group -p WorkingDirectory -p ExecStart -p EnvironmentFiles -p MainPID -p ActiveState -p Restart -p FragmentPath -p DropInPaths
          pid="$(systemctl show finalcut -p MainPID --value)"
          [ -n "$pid" ] && [ "$pid" != 0 ] && { echo "cwd: $(readlink -f /proc/$pid/cwd)"; echo "exe: $(readlink -f /proc/$pid/exe)"; ps -o user=,pid=,etime=,args= -p "$pid"; }
          echo "== $APP_DIR"
          stat -c '%F %U:%G %a %n' "$APP_DIR"; readlink -f "$APP_DIR"
          ls -la "$APP_DIR"
          echo "== parent"; ls -la "$(dirname "$APP_DIR")"
          echo "== top-level entries NOT in git HEAD (runtime/build state)"
          cd "$APP_DIR"
          for e in * .[!.]*; do
            [ -e "$e" ] || continue
            if printf '%s\n' "$tracked" | grep -qxF "$e"; then continue; fi
            printf '%-28s %s %s files=%s\n' "$e" "$(stat -c '%F %U:%G' "$e")" "$(du -sh "$e" 2>/dev/null | cut -f1)" "$(find "$e" -type f 2>/dev/null | wc -l)"
          done
          echo "== .env* key names only"
          for f in .env*; do [ -f "$f" ] && { echo "-- $f"; grep -oE '^[[:space:]]*(export[[:space:]]+)?[A-Za-z_][A-Za-z0-9_]*=' "$f" | sed -E 's/^[[:space:]]*(export[[:space:]]+)?//; s/=$//' | sort; }; done
          echo "== files written since last deploy (REVISION), excluding node_modules/dist (names only, max 60)"
          [ -f REVISION ] && find . -newer REVISION -type f -not -path './node_modules/*' -not -path './dist*' 2>/dev/null | head -60
          echo "== open files of the service under APP_DIR (max 40)"
          [ -n "$pid" ] && ls -l /proc/$pid/fd 2>/dev/null | awk '{print $NF}' | grep -F "$APP_DIR" | sort -u | head -40
          echo "== nginx refs to APP_DIR"; grep -RnF "$APP_DIR" /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | sed -E 's/(ssl_certificate_key|password|secret)[^;]*/\1 <redacted>/I'
          echo "== other refs (cron, systemd)"; grep -RlF "$APP_DIR" /etc/systemd/system /etc/cron* /var/spool/cron 2>/dev/null
          echo "== disk"; df -h "$APP_DIR"
          echo "== node"; node -v; npm -v
          REMOTE
          {
            printf "APP_DIR='%s'\n" "$APP_DIR"
            printf "tracked=\"\$(cat <<'TRACKED'\n"; cat /tmp/tracked.txt; printf 'TRACKED\n)"\n'
            cat /tmp/remote.sh
          } > /tmp/full.sh
          bash -n /tmp/full.sh
          ssh -o BatchMode=yes "$TARGET" 'bash -s' < /tmp/full.sh || true
      - name: "Inspect nginx / firewall / port 80 / mysql (read-only)"
        if: ${{ github.event.inputs.section == 'nginx' }}
        run: |
          set -uo pipefail
          echo "== from the runner: http://, www, https"
          for u in http://grepawk.com/ http://www.grepawk.com/ https://www.grepawk.com/ https://grepawk.com/; do
            echo "-- $u"; curl -s -m 10 -o /dev/null -w '%{http_code} %{redirect_url} %{http_version}\n' "$u" || echo "curl exit $?"
          done
          cat > /tmp/nginx-remote.sh <<'REMOTE'
          set -u
          echo "== nginx -V (modules)"; nginx -V 2>&1 | tr ' ' '\n' | grep -E 'version|brotli|http_v2|gzip_static|ssl' | head -20
          ls /etc/nginx/modules-enabled/ 2>/dev/null
          echo "== nginx -t"; nginx -t 2>&1 | tail -2
          echo "== listening sockets 80/443"; ss -ltnp 2>/dev/null | grep -E ':(80|443)\s' || echo none
          echo "== ufw"; (ufw status verbose 2>&1 || echo "ufw not available") | head -40
          echo "== iptables INPUT (first 40)"; iptables -S INPUT 2>/dev/null | head -40
          echo "== local http://127.0.0.1 Host: grepawk.com"; curl -s -m 5 -o /dev/null -w '%{http_code} %{redirect_url}\n' -H 'Host: grepawk.com' http://127.0.0.1/ || echo "curl exit $?"
          echo "== DO droplet metadata (id/region only)"; curl -s -m 3 http://169.254.169.254/metadata/v1/id; echo; curl -s -m 3 http://169.254.169.254/metadata/v1/region; echo
          echo "== server blocks: file:line listen/server_name/root/include (all sites)"
          grep -RnE '^\s*(listen|server_name|root|include|return 301|ssl_certificate )' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null
          echo "== http-level gzip/brotli settings (nginx.conf)"; grep -nE 'gzip|brotli|http2|server_tokens' /etc/nginx/nginx.conf
          T="$(grep -RlF "root $APP_DIR/dist;" /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -1)"
          echo "== FULL finalcut site file: $T -> $(readlink -f "$T")"
          cat -n "$(readlink -f "$T")"
          echo "== mysql"; systemctl is-active mysql mariadb 2>/dev/null; (mysql -N -e 'SHOW DATABASES' 2>&1 | head -20)
          for db in photo_recipes finalcut; do echo "-- $db tables"; mysql -N -e "SHOW TABLES" "$db" 2>&1 | head -40; done
          echo "-- telemetry_events schema"; mysql -N -e 'SHOW CREATE TABLE telemetry_events\G' photo_recipes 2>&1 | head -40
          echo "== finalcut .env MYSQL key names"; grep -oE '^[A-Z_]*(MYSQL|DB_|DATABASE)[A-Z_]*=' "$APP_DIR/.env" 2>/dev/null
          REMOTE
          { printf "APP_DIR='%s'\n" "$APP_DIR"; cat /tmp/nginx-remote.sh; } > /tmp/nfull.sh
          ssh -o BatchMode=yes "$TARGET" 'bash -s' < /tmp/nfull.sh || true
      - name: "Inspect photo/music vhosts + static roots (read-only)"
        if: ${{ github.event.inputs.section == 'vhosts' }}
        run: |
          set -uo pipefail
          cat > /tmp/vh.sh <<'REMOTE'
          set -u
          for f in /etc/nginx/sites-enabled/music.grepawk.com /etc/nginx/sites-enabled/photo-recipes; do
            echo "== FULL $f -> $(readlink -f "$f")"; cat -n "$(readlink -f "$f")"
          done
          echo "== ls /var/www/music-radar"; ls -la /var/www/music-radar /var/www/music-radar/screenshots 2>&1 | head -60
          echo "== ls /var/www (dirs)"; ls -la /var/www 2>&1 | head -40
          echo "== services listening 87xx/88xx"; ss -ltnp 2>/dev/null | grep -E ':(87|88)[0-9]{2}\s' || true
          echo "== systemd units music*/photo*"; systemctl list-units --type=service --no-pager 2>/dev/null | grep -iE 'music|photo|radar|reader' || true
          for u in music-radar-api photo-recipes; do echo "-- $u"; systemctl cat "$u" 2>/dev/null | grep -E '^(WorkingDirectory|ExecStart|EnvironmentFile)=' ; done
          echo "== /etc/letsencrypt/renewal"; ls /etc/letsencrypt/renewal 2>&1
          REMOTE
          ssh -o BatchMode=yes "$TARGET" 'bash -s' < /tmp/vh.sh || true
