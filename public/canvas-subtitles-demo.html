<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas Subtitle Burn-In Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      min-height: 100vh;
    }
    h1 { font-size: 20px; margin-bottom: 4px; color: #e6edf3; }
    p.subtitle { font-size: 13px; color: #8b949e; margin-bottom: 20px; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 20px;
      width: 100%;
      max-width: 680px;
    }
    .input-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    input[type="text"], input[type="file"] {
      flex: 1;
      min-width: 0;
      padding: 7px 10px;
      background: #0d1117;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-size: 13px;
    }
    canvas {
      width: 100%;
      display: block;
      background: #000;
      border-radius: 6px;
      margin-bottom: 14px;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 10px;
    }
    button, .dl-link {
      padding: 8px 14px;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid #3a4250;
      cursor: pointer;
      background: #21262d;
      color: #e6edf3;
      text-decoration: none;
      display: inline-block;
    }
    button:hover { background: #2f3644; }
    button.rec-stop { background: #6e1a1a; border-color: #a03030; }
    .dl-link { background: #1a3a1a; color: #58a65c; border-color: #2d6b30; }
    #corsMsg {
      color: #f85149;
      font-size: 12px;
      margin-bottom: 10px;
      display: none;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 10px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #8b949e;
      margin-bottom: 12px;
      cursor: pointer;
    }
    label { font-size: 12px; color: #c9d1d9; }
    select {
      padding: 4px 8px;
      background: #0d1117;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>🎬 Canvas Subtitle Burn-In Demo</h1>
  <p class="subtitle">Subtitles are always visible — drawn directly onto the canvas. Export WebM with burned-in subtitles.</p>

  <div class="card">
    <!-- Video source picker -->
    <div class="input-row">
      <input type="file" id="filePicker" accept="video/*" />
    </div>
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="…or paste a video URL (must be CORS-accessible)" />
      <button id="loadUrlBtn">Load URL</button>
    </div>

    <!-- CORS warning -->
    <p id="corsMsg">⚠ CORS error: the video is cross-origin and the canvas is tainted. Export/recording may fail.</p>

    <!-- Hidden video — decode/source only -->
    <video id="video" crossorigin="anonymous" playsinline style="display:none"></video>

    <!-- Canvas — the visible player -->
    <canvas id="canvas"></canvas>

    <!-- Scrub slider -->
    <input type="range" id="scrubber" min="0" max="0" step="0.001" value="0" />

    <!-- Time / frame info -->
    <div class="info-row">
      <span id="timeInfo">Time: 00:00.00</span>
      <span id="frameInfo">Frame: 0 / 0</span>
    </div>

    <!-- FPS picker -->
    <div style="margin-bottom:12px">
      <label for="fpsSel">FPS: </label>
      <select id="fpsSel">
        <option value="24">24</option>
        <option value="25">25</option>
        <option value="30" selected>30</option>
        <option value="60">60</option>
      </select>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="frameBackBtn">◀ Frame</button>
      <button id="playBtn">▶ Play</button>
      <button id="frameForwardBtn">Frame ▶</button>
      <button id="startRecBtn">⏺ Start Recording</button>
      <button id="stopRecBtn" class="rec-stop" style="display:none">⏹ Stop Recording</button>
      <a id="dlWebm" class="dl-link" download="burned_subs.webm" style="display:none">⬇ Download WebM</a>
    </div>
  </div>

  <script>
    // ── Demo subtitle (embedded VTT via Blob URL) ──────────────────────────
    const DEMO_VTT = `WEBVTT

00:00:01.000 --> 00:00:04.000
Hello! These subtitles are burned into the canvas.

00:00:04.500 --> 00:00:08.000
No need to enable captions — they are always visible.

00:00:08.500 --> 00:00:13.000
Use "Start Recording" to export a WebM with burned-in subtitles.

00:00:13.500 --> 00:00:18.000
Load your own video file or paste a URL above.
`;
    const vttBlob = new Blob([DEMO_VTT], { type: 'text/vtt' });
    const demoVttUrl = URL.createObjectURL(vttBlob);

    // ── Elements ────────────────────────────────────────────────────────────
    const video      = document.getElementById('video');
    const canvas     = document.getElementById('canvas');
    const ctx        = canvas.getContext('2d');
    const scrubber   = document.getElementById('scrubber');
    const timeInfo   = document.getElementById('timeInfo');
    const frameInfo  = document.getElementById('frameInfo');
    const fpsSel     = document.getElementById('fpsSel');
    const playBtn    = document.getElementById('playBtn');
    const frameBackBtn    = document.getElementById('frameBackBtn');
    const frameForwardBtn = document.getElementById('frameForwardBtn');
    const startRecBtn = document.getElementById('startRecBtn');
    const stopRecBtn  = document.getElementById('stopRecBtn');
    const dlWebm      = document.getElementById('dlWebm');
    const corsMsg     = document.getElementById('corsMsg');
    const filePicker  = document.getElementById('filePicker');
    const urlInput    = document.getElementById('urlInput');
    const loadUrlBtn  = document.getElementById('loadUrlBtn');

    let rafId = null;
    let fps   = 30;

    // ── Subtitle track setup ─────────────────────────────────────────────
    function attachDemoTrack() {
      // Remove any existing tracks
      while (video.firstChild) video.removeChild(video.firstChild);
      const track = document.createElement('track');
      track.kind    = 'subtitles';
      track.src     = demoVttUrl;
      track.srclang = 'en';
      track.label   = 'English';
      track.default = true;
      video.appendChild(track);
    }

    function hideNativeCaptions() {
      for (let i = 0; i < video.textTracks.length; i++) {
        video.textTracks[i].mode = 'hidden';
      }
    }

    // ── RAF render loop ──────────────────────────────────────────────────
    function renderFrame() {
      // Draw video frame
      try {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      } catch (e) {
      } catch (e) {
        if (e.name === 'SecurityError') {
          corsMsg.style.display = 'block';
          return; // Stop the loop on CORS error
        }
      }
      }

      // Ensure native captions stay hidden
      hideNativeCaptions();

      // Draw active subtitle cues
      const track = video.textTracks && video.textTracks[0];
      if (track && track.activeCues && track.activeCues.length > 0) {
        const fontSize = Math.max(16, Math.floor(canvas.height * 0.045));
        ctx.font      = `bold ${fontSize}px Arial, sans-serif`;
        ctx.textAlign = 'center';

        for (let i = 0; i < track.activeCues.length; i++) {
          const cue   = track.activeCues[i];
          const rawText = (() => {
            try {
              const div = document.createElement('div');
              div.innerHTML = cue.text || '';
              return div.textContent || '';
            } catch (_) { return cue.text || ''; }
          })();
          const lines = rawText.split('\n');
          const lineH = fontSize * 1.4;
          const totalH = lines.length * lineH;
          const baseY = canvas.height * 0.88 - totalH / 2;
          const x     = canvas.width / 2;

          // Measure widest line
          let maxW = 0;
          lines.forEach(l => { const w = ctx.measureText(l).width; if (w > maxW) maxW = w; });

          const padX = 14, padY = 8;
          ctx.fillStyle = 'rgba(0,0,0,0.55)';
          ctx.fillRect(x - maxW / 2 - padX, baseY - fontSize - padY, maxW + padX * 2, totalH + padY * 2);

          lines.forEach((line, idx) => {
            const y = baseY + idx * lineH;
            ctx.strokeStyle = 'rgba(0,0,0,0.9)';
            ctx.lineWidth   = 3;
            ctx.strokeText(line, x, y);
            ctx.fillStyle   = '#ffffff';
            ctx.fillText(line, x, y);
          });
        }
      }

      rafId = requestAnimationFrame(renderFrame);
    }

    function startLoop() {
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(renderFrame);
    }

    // ── Video metadata / time ────────────────────────────────────────────
    video.addEventListener('loadedmetadata', () => {
      canvas.width  = video.videoWidth  || 640;
      canvas.height = video.videoHeight || 360;
      scrubber.max  = video.duration;
      hideNativeCaptions();
      startLoop();
    });

    // textTracks change (fires when track list is updated)
    video.textTracks.addEventListener('change', hideNativeCaptions);

    video.addEventListener('timeupdate', () => {
      const t = video.currentTime;
      scrubber.value = t;
      fps = Number(fpsSel.value);
      const mins   = String(Math.floor(t / 60)).padStart(2, '0');
      const secs   = String(Math.floor(t % 60)).padStart(2, '0');
      const frames = String(Math.floor((t % 1) * fps)).padStart(2, '0');
      timeInfo.textContent  = `Time: ${mins}:${secs}.${frames}`;
      frameInfo.textContent = `Frame: ${Math.floor(t * fps)} / ${Math.floor(video.duration * fps)}`;
    });

    // ── Load helpers ─────────────────────────────────────────────────────
    function loadSource(src) {
      corsMsg.style.display = 'none';
      cancelAnimationFrame(rafId);
      video.src = src;
      attachDemoTrack();
      video.load();
    }

    filePicker.addEventListener('change', () => {
      if (filePicker.files[0]) loadSource(URL.createObjectURL(filePicker.files[0]));
    });

    loadUrlBtn.addEventListener('click', () => {
      const url = urlInput.value.trim();
      if (url) loadSource(url);
    });

    // ── Play / Pause ──────────────────────────────────────────────────────
    playBtn.addEventListener('click', () => {
      if (video.paused) { video.play(); playBtn.textContent = '⏸ Pause'; }
      else              { video.pause(); playBtn.textContent = '▶ Play'; }
    });
    video.addEventListener('ended', () => { playBtn.textContent = '▶ Play'; });

    // ── Frame step ────────────────────────────────────────────────────────
    frameBackBtn.addEventListener('click', () => {
      video.currentTime = Math.max(0, video.currentTime - 1 / Number(fpsSel.value));
    });
    frameForwardBtn.addEventListener('click', () => {
      video.currentTime = Math.min(video.duration || 0, video.currentTime + 1 / Number(fpsSel.value));
    });

    // ── Scrubber ──────────────────────────────────────────────────────────
    scrubber.addEventListener('input', () => {
      video.currentTime = Number(scrubber.value);
    });

    // ── Recording / Export ────────────────────────────────────────────────
    let recorder = null;
    let chunks   = [];

    startRecBtn.addEventListener('click', () => {
      chunks = [];
      dlWebm.style.display = 'none';
      try {
        const outStream = canvas.captureStream(30);

        // Best-effort audio
        try {
          const vStream = video.captureStream ? video.captureStream() : null;
          if (vStream) {
            const at = vStream.getAudioTracks();
            if (at.length) outStream.addTrack(at[0]);
          }
        } catch (err) { /* no audio — continue */
          console.warn('Audio capture skipped:', err);
        }

        const types = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
        const mime  = types.find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';
        recorder = new MediaRecorder(outStream, { mimeType: mime });
        recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          dlWebm.href         = URL.createObjectURL(blob);
          dlWebm.style.display = 'inline-block';
          stopRecBtn.style.display  = 'none';
          startRecBtn.style.display = 'inline-block';
        };
        recorder.start(100);
        startRecBtn.style.display = 'none';
        stopRecBtn.style.display  = 'inline-block';
      } catch (e) {
        corsMsg.style.display = 'block';
      }
    });

    stopRecBtn.addEventListener('click', () => {
      if (recorder && recorder.state !== 'inactive') recorder.stop();
    });

    // ── Kick off with demo content immediately ────────────────────────────
    // Draw a placeholder frame so the canvas isn't invisible on load
    canvas.width  = 640;
    canvas.height = 360;
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, 640, 360);
    ctx.fillStyle = '#8b949e';
    ctx.font      = '18px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Load a video file or paste a URL to begin', 320, 180);
  </script>
</body>
</html>
