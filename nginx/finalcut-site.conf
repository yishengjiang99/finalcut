# FinalCut / FinalCap site settings for the grepawk.com server block.
# Installed as /etc/nginx/snippets/finalcut-site.conf and included ONCE inside the grepawk.com
# `listen 443` server block by scripts/nginx/finalcut-site-nginx.sh (deploy-grepawk.yml).
# Scope: only adds directives to this server block. COOP/COEP stay exactly where they already
# are (server level); the /v2 locations (finalcut-v2.locations.conf) are untouched.

# HSTS (no preload, no includeSubDomains yet). Server-level, so it rides on every response that
# does not set its own add_header (the HTML document, API, redirects).
add_header Strict-Transport-Security "max-age=31536000" always;

# Compression for static text assets (gzip is already `on` at http level for text/html only).
# application/json and text/plain are deliberately NOT listed, so API responses (/api, the iOS
# app's endpoints, /music-radar/api, /high-priestess/api) are byte-for-byte unchanged.
# No brotli: the server's nginx 1.18 build has no brotli module.
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript image/svg+xml application/xml text/xml application/manifest+json application/wasm;

# The HTML shell must revalidate on every load: its hashed /assets/* references change with each
# build, and a stale cached shell would point at deleted files. "/" reaches this location through the
# `index index.html` internal redirect, and so do /success and the 404 fallbacks. add_header in a
# location replaces the inherited server-level headers, so the shared set is re-included (same
# pattern as /media/ below). `location /` gets the same two lines from finalcut-site-nginx.sh.
location = /index.html {
    include /etc/nginx/snippets/finalcut-site-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# The SPA's only client-side route besides "/" (Stripe checkout return: src/App.jsx, src/server/
# stripe.js, src/server/auth.js). Every other unknown path is now a real 404 (see `location /`).
location = /success {
    try_files /index.html =404;
}

# Orphaned GitHub webhook target: no service on this host handles /cb/github any more. Answer
# every method directly (no redirect) with 410 Gone so deliveries stop being retried as redirects.
location = /cb/github { return 410; }
location = /cb/github/ { return 410; }

# Static guide pages (scripts/build-task-pages.mjs -> dist/<slug>.html) at clean URLs. Exact-match
# locations, so they win over every prefix/regex location; no add_header here, so the server-level
# headers apply exactly as they do to "/". The .html and trailing-slash variants redirect to the
# canonical URL, as does the older name /lyric-captions.
location = /add-subtitles { try_files /add-subtitles.html =404; }
location = /translate-subtitles { try_files /translate-subtitles.html =404; }
location = /add-lyrics-to-video { try_files /add-lyrics-to-video.html =404; }
location = /edit-video-without-uploading { try_files /edit-video-without-uploading.html =404; }
location = /about { try_files /about.html =404; }
location = /finalcap-vs-capcut { try_files /finalcap-vs-capcut.html =404; }
location = /finalcap-vs-descript { try_files /finalcap-vs-descript.html =404; }
location = /add-subtitles/ { return 301 /add-subtitles; }
location = /translate-subtitles/ { return 301 /translate-subtitles; }
location = /add-lyrics-to-video/ { return 301 /add-lyrics-to-video; }
location = /edit-video-without-uploading/ { return 301 /edit-video-without-uploading; }
location = /about/ { return 301 /about; }
location = /finalcap-vs-capcut/ { return 301 /finalcap-vs-capcut; }
location = /finalcap-vs-descript/ { return 301 /finalcap-vs-descript; }
location = /add-subtitles.html { return 301 /add-subtitles; }
location = /translate-subtitles.html { return 301 /translate-subtitles; }
location = /add-lyrics-to-video.html { return 301 /add-lyrics-to-video; }
location = /edit-video-without-uploading.html { return 301 /edit-video-without-uploading; }
location = /about.html { return 301 /about; }
location = /finalcap-vs-capcut.html { return 301 /finalcap-vs-capcut; }
location = /finalcap-vs-descript.html { return 301 /finalcap-vs-descript; }
location = /lyric-captions { return 301 /add-lyrics-to-video; }

# Blog (scripts/build-blog.mjs -> dist/blog/index.html, dist/blog/<slug>/index.html, rss.xml). Posts
# live at /blog/<slug> with no trailing slash; the slash and .html variants redirect there. No
# add_header here, so the server-level headers apply exactly as they do to the guide pages.
location = /blog { try_files /blog/index.html =404; }
location = /blog/ { return 301 /blog; }
location = /blog/index.html { return 301 /blog; }
location ^~ /blog/ {
    rewrite ^/blog/([a-z0-9-]+)/(?:index\.html)?$ /blog/$1 permanent;
    rewrite ^/blog/([a-z0-9-]+)\.html$ /blog/$1 permanent;
    try_files $uri $uri/index.html =404;
}

# Blog media (scripts/blog/media.mjs -> dist/media/blog/): content-hashed images (AVIF/WebP/JPEG/PNG)
# and self-hosted videos. Immutable cache; nginx serves byte ranges for static files, so video seeking
# works. Not gzipped (already compressed).
location ^~ /media/ {
    types {
        image/avif avif;
        image/webp webp;
        image/jpeg jpg jpeg;
        image/png png;
        video/mp4 mp4;
        video/webm webm;
        text/vtt vtt;
    }
    include /etc/nginx/snippets/finalcut-site-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# /legal has no index page; send it to the privacy policy.
location = /legal { return 301 /legal/privacy.html; }
location = /legal/ { return 301 /legal/privacy.html; }

# Hashed build assets that the generic static-asset location does not cover (hero video, WebP
# images, speech-model wasm/json): long immutable cache, proper wasm MIME type, gzip for wasm/json.
location ~* ^/assets/.+\.(mp4|webm|webp|avif|wasm|json)$ {
    types {
        video/mp4 mp4;
        video/webm webm;
        image/webp webp;
        image/avif avif;
        application/wasm wasm;
        application/json json;
    }
    gzip_types application/wasm application/json;
    include /etc/nginx/snippets/finalcut-site-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# FilmCraft web build (github.com/yishengjiang99/filmcraft, docs/deploy-grepawk.md): a static wasm app
# deployed separately into /var/www/filmcraft (NOT dist/, so the site deploy's dist swap leaves it alone).
# Scope: /filmcraft/ only. It sets its own add_header, so the server-level set is re-included from
# the headers snippet (COOP same-origin + COEP require-corp, unchanged for the rest of the site) and
# CORP same-origin is added here only. No nested locations, so nothing else to re-include.
# Filenames are not hashed; index.html loads the JS + wasm with ?v=<build stamp>, so only requests
# carrying ?v= get the long immutable cache; everything else (index.html, worklet) revalidates.
location = /filmcraft { return 301 /filmcraft/; }
location ^~ /filmcraft/ {
    alias /var/www/filmcraft/;
    index index.html;
    types {
        text/html html;
        application/javascript js mjs;
        application/wasm wasm;
        image/png png;
        application/json json;
    }
    gzip_types application/javascript application/wasm application/json;
    set $filmcraft_cache "no-cache";
    if ($arg_v) { set $filmcraft_cache "public, max-age=31536000, immutable"; }
    include /etc/nginx/snippets/finalcut-site-headers.conf;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $filmcraft_cache always;
}
