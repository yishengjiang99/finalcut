# blog.grepawk.com: the GrepAwk blog (scripts/build-blog.mjs) on its own host name, served from the
# SAME dist/ as https://grepawk.com/blog. grepawk.com/blog stays the canonical URL: every page already
# carries <link rel="canonical" href="https://grepawk.com/blog/..."> (BLOG_URL), so this host is an
# alias and the sitemap / RSS / IndexNow keep listing grepawk.com/blog URLs only.
# Installed as /etc/nginx/sites-enabled/finalcut-blog.conf by scripts/nginx/finalcut-site-nginx.sh
# (only when the blog.grepawk.com certificate exists). Certificate: certbot certonly --nginx -d blog.grepawk.com
#
#   /            -> dist/blog/index.html        /<slug>  -> dist/blog/<slug>/index.html
#   /rss.xml     -> dist/blog/rss.xml           /blog, /blog/<slug> -> same as on grepawk.com (the
#   /media/...   -> dist/media/... (ranges)       build's root-relative links point there)
#   /sitemap.xml, /favicon.ico, /assets/... -> dist/ as-is

server {
    listen 80;
    server_name blog.grepawk.com;
    return 301 https://blog.grepawk.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name blog.grepawk.com;
    ssl_certificate /etc/letsencrypt/live/blog.grepawk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.grepawk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Trailing slash on purpose: finalcut-site-nginx.sh finds the grepawk.com file by the exact line
    # `root <app_dir>/dist;`, which must stay unique.
    root /home/finalcut/apps/pages/finalcut/dist/;
    index index.html;
    include /etc/nginx/snippets/finalcut-site-headers.conf;
    error_page 404 /404.html;

    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/xml text/xml;

    location = / { try_files /blog/index.html =404; }
    location = /index.html { return 301 /; }
    location = /rss.xml { try_files /blog/rss.xml =404; }

    # Same rules as grepawk.com (nginx/finalcut-site.conf); the build's links are /blog/<slug>.
    location = /blog { try_files /blog/index.html =404; }
    location = /blog/ { return 301 /blog; }
    location = /blog/index.html { return 301 /blog; }
    location ^~ /blog/ {
        rewrite ^/blog/([a-z0-9-]+)/(?:index\.html)?$ /blog/$1 permanent;
        rewrite ^/blog/([a-z0-9-]+)\.html$ /blog/$1 permanent;
        try_files $uri $uri/index.html =404;
    }

    location ^~ /media/ {
        types {
            image/avif avif;
            image/webp webp;
            image/jpeg jpg jpeg;
            image/png png;
            video/mp4 mp4;
            video/webm webm;
            text/vtt vtt;
        }
        include /etc/nginx/snippets/finalcut-site-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # /<slug> -> the post; /<slug>/ redirects to the slash-less URL.
    location ~ "^/([a-z0-9-]+)/$" { return 301 /$1; }
    location ~ "^/([a-z0-9-]+)$" { try_files /blog/$1/index.html =404; }

    # favicon, apple-touch-icon, sitemap.xml, robots.txt, /assets/...
    location / { try_files $uri =404; }
}
