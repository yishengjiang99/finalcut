# Headers for locations in finalcut-site.conf that set their own add_header (nginx does not merge
# server-level add_header into such locations). Same set the server block sends today, plus HSTS.
# Installed as /etc/nginx/snippets/finalcut-site-headers.conf.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Strict-Transport-Security "max-age=31536000" always;
