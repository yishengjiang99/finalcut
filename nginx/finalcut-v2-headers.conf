# Headers for the /v2 editor only (installed as /etc/nginx/snippets/finalcut-v2-headers.conf).
# Any location that has its own add_header loses the server-level ones (nginx does not merge),
# so the existing security headers are repeated here next to the isolation headers.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
# Cross-origin isolation -> SharedArrayBuffer -> multithreaded @ffmpeg/core-mt.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
