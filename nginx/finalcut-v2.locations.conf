# FinalCut /v2 editor (in-browser FFmpeg). Installed as /etc/nginx/snippets/finalcut-v2.locations.conf
# and included ONCE inside the existing grepawk.com `listen 443` server block:
#
#     include snippets/finalcut-v2.locations.conf;
#
# Scope: only URIs under /v2/ match these locations (`^~` also stops the server's regex
# static-asset location from matching /v2/*.js). Every other location, /api, /auth, /legal,
# the current editor at /, and every other server block / site are untouched.
# Files come from dist/v2/ (built by `npm run build:v2`) under the existing `root`.

location = /v2 {
    return 301 /v2/$is_args$args;
}

location ^~ /v2/ {
    include snippets/finalcut-v2-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /v2/index.html;

    # Hashed Vite output (page JS + ffmpeg.wasm module worker).
    location ^~ /v2/assets/ {
        include snippets/finalcut-v2-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Self-hosted, versioned ffmpeg.wasm cores: /v2/ffmpeg-core/{mt,st}/<version>/...
    location ^~ /v2/ffmpeg-core/ {
        # nginx 1.18 mime.types has no wasm entry (served as octet-stream today), which breaks
        # WebAssembly.instantiateStreaming. A types{} block replaces the map for this location only.
        types {
            application/wasm        wasm;
            text/javascript         js;
            application/json        json;
        }
        default_type application/octet-stream;
        include snippets/finalcut-v2-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip on;
        gzip_types application/wasm text/javascript application/json;
        try_files $uri =404;
    }

    # GPL Corresponding Source for the cores above (archives, SHA256SUMS, versions.json, license
    # texts), published by scripts/fetch-ffmpeg-source.mjs during `npm run build:v2`.
    location ^~ /v2/vendor/ffmpeg/source/ {
        types {
            text/html               html;
            text/plain              txt asc;
            application/json        json;
            application/gzip        gz;
            application/x-xz        xz;
            application/zip         zip;
        }
        default_type text/plain;    # SHA256SUMS
        charset utf-8;
        include snippets/finalcut-v2-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
