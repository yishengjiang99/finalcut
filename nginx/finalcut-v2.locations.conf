# FinalCut in-browser FFmpeg: nginx locations for the retired /v2 standalone editor.
# Installed as /etc/nginx/snippets/finalcut-v2.locations.conf and included ONCE inside the
# existing grepawk.com `listen 443` server block:
#
#     include snippets/finalcut-v2.locations.conf;
#
# The main app at / is the editor now (it loads the same cores from /v2/ffmpeg-core/), so the
# /v2 page and its assets redirect there. The self-hosted ffmpeg.wasm cores and the GPL
# Corresponding Source stay served under /v2/ (the app and the license page need them).
#
# Scope: only URIs under /v2/ match these locations (`^~` also stops the server's regex
# static-asset location from matching /v2/*.js). Every other location, /api, /auth, /legal,
# the current editor at /, and every other server block / site are untouched.
# Files come from dist/v2/ (built by `npm run build:v2`) under the existing `root`.

location = /v2 {
    return 301 /$is_args$args;
}

# Self-hosted, versioned ffmpeg.wasm cores: /v2/ffmpeg-core/{mt,st}/<version>/...
location ^~ /v2/ffmpeg-core/ {
    # nginx 1.18 mime.types has no wasm entry (served as octet-stream today), which breaks
    # WebAssembly.instantiateStreaming. A types{} block replaces the map for this location only.
    types {
        application/wasm        wasm;
        text/javascript         js;
        application/json        json;
    }
    default_type application/octet-stream;
    include snippets/finalcut-v2-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    gzip on;
    gzip_types application/wasm text/javascript application/json;
    try_files $uri =404;
}

# GPL Corresponding Source for the cores above (archives, SHA256SUMS, versions.json, license
# texts), published by scripts/fetch-ffmpeg-source.mjs during `npm run build:v2`.
location ^~ /v2/vendor/ffmpeg/source/ {
    types {
        text/html               html;
        text/plain              txt asc;
        application/json        json;
        application/gzip        gz;
        application/x-xz        xz;
        application/zip         zip;
    }
    default_type text/plain;    # SHA256SUMS
    charset utf-8;
    include snippets/finalcut-v2-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    index index.html;
    try_files $uri $uri/ =404;
}

# The retired editor page and its assets: everything else under /v2/ goes to the main app.
# (Longest-prefix match keeps /v2/ffmpeg-core/ and /v2/vendor/ffmpeg/source/ above.)
location ^~ /v2/ {
    return 301 /$is_args$args;
}
