server {
    listen 80;
    server_name grepawk.com www.grepawk.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name grepawk.com www.grepawk.com;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/grepawk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grepawk.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Root directory for built frontend files
    root /home/finalcut/apps/pages/finalcut/dist;
    include /etc/nginx/snippets/finalcut-v2.locations.conf; # finalcut /v2 (managed by deploy-grepawk.yml)
    index index.html;

    # BEGIN photo-recipes apple-attribution-postbacks (managed by photo-recipes deploy.sh)
    # Apple sends SKAdNetwork / AdAttributionKit postback copies to the registrable
    # domain (grepawk.com), so these paths proxy to the Photo Recipes API on :8787.
    location ^~ /.well-known/skadnetwork/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }
    location ^~ /.well-known/appattribution/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }
    # END photo-recipes apple-attribution-postbacks

    # Add security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CORS headers for FFmpeg WebAssembly
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # App Store / legal pages — never SPA-fallback to the React shell
    location ^~ /legal/ {
        try_files $uri =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # AI Music Radar API + admin (yishengjiang99/earsheet server/, systemd music-radar-api on 127.0.0.1:8790)
    location ^~ /music-radar/api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 512k;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /music-radar/admin {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    # AI Music Radar support/privacy/terms (static, /var/www/music-radar; source yishengjiang99/earsheet docs/legal/music-radar)
    location = /music-radar { return 301 /music-radar/; }
    location ^~ /music-radar/ {
        root /var/www;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # EarSheet web demo (static files, deployed by yishengjiang99/earsheet tools/web-demo/deploy-grepawk.sh)
    location = /music-hear { return 301 /music-hear/; }
    location ^~ /music-hear/ {
        root /var/www;
        index index.html;
        types {
            text/html html;
            text/css css;
            text/javascript js mjs;
            application/json json;
            application/wasm wasm;
            application/octet-stream bin;
            text/plain txt;
        }
        default_type application/octet-stream;
        charset utf-8;
        charset_types text/css text/javascript application/json text/plain;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Temple of the High Priestess API (yishengjiang99/seal-of-the-high-priestess server/, systemd temple-api on 127.0.0.1:8791)
    location ^~ /high-priestess/api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 4m;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Temple of the High Priestess support/privacy/terms (static, /var/www/high-priestess; source docs/legal/high-priestess)
    location = /high-priestess { return 301 /high-priestess/; }
    location ^~ /high-priestess/ {
        root /var/www;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy authentication routes to Node.js server
    location /auth {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy API routes to Node.js server
    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Increase client body size for uploads
    client_max_body_size 100M;
}
